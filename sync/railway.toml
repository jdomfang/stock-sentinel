# Railway config for the nightly price sync.
#   Root Directory : (repo root — leave blank)
#   Dockerfile Path: sync/Dockerfile

[build]
builder = "DOCKERFILE"

[deploy]
# 23:00 UTC = 19:00 EDT / 18:00 EST -- after the US close either way, so it does
# not need adjusting twice a year. Railway crons are UTC; the laptop crontab was
# local time, which is a difference worth stating rather than discovering.
#
# WHY 23:00 AND NOT 01:00. The free tier does not publish a day's bars at
# 01:00 UTC the next morning: verified 2026-09-03, the 09-02 bar was refused at
# 01:03 ("Attempted to request today's data before end of day") and present at
# 23:43. At 01:00 the walk-back therefore lands on the PREVIOUS day every night,
# re-writing rows that already exist, and the newest bar the app ever sees is
# two days old. Running at 23:00 UTC -- seven hours after the 16:00 ET close --
# is late enough for the bar to exist and early enough that Discovery has it
# the same evening.
#
# THIS FILE IS DOCUMENTATION. Railway does not read it (see docs/ENVIRONMENTS.md);
# the schedule below must be typed into the service's Cron Schedule field in
# the Railway UI, and this line updated whenever that field changes.
cronSchedule = "0 23 * * *"

# NEVER. A ~100 minute job that restarts on exit would run continuously and burn
# the entire Polygon daily quota.
restartPolicyType = "NEVER"

# No healthcheckPath: this serves no HTTP and exits when done.
