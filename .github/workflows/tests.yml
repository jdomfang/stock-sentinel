# Run the suite on every push and pull request.
#
# Until now .github/workflows/ held one keepalive ping and nothing else, so
# nothing verified anything unless a human remembered to. This repo moves money:
# it debits credits, calls a metered API that bills per post returned, and takes
# Stripe payments. "Somebody ran the tests locally" is not a control.
#
# The Postgres service is pinned to the same 17.6 as production and
# docker-compose.test.yml, and exposed on 5433 because that is the port every
# suite already hardcodes.
name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          # supabase_admin, NOT postgres. The stub creates `postgres` as
          # NOSUPERUSER NOBYPASSRLS to match Supabase; if postgres were the
          # bootstrap superuser the RLS assertions would pass vacuously,
          # because a superuser owner bypasses row-level security.
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentinel_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d sentinel_test"
          --health-interval 2s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11 is the Streamlit Cloud runtime. tests/test_runtime_compat.py
          # asserts the source parses on the DEPLOY target, and several of its
          # checks only bite below 3.12 -- running CI on a newer interpreter
          # would make that suite quietly stop testing what it exists for.
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify PostgreSQL test service
        run: >-
          python3 -c "import psycopg2;
          c=psycopg2.connect('host=127.0.0.1 port=5433 dbname=sentinel_test user=supabase_admin password=postgres');
          c.close(); print('PostgreSQL test service is ready')"

      - name: Run every suite
        shell: bash
        run: |
          set -o pipefail
          python3 tests/run_all.py 2>&1 | tee test-results.log

      - name: Publish test summary
        if: always()
        run: |
          echo '### Full test-suite output' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 500 test-results.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
