# Publish the nightly sector pulse as static pages.
#
# The sync service computes ten sector rows at 23:00 UTC. This turns them into
# one page per trading day, commits them to develop, and Cloudflare Pages picks
# the push up and deploys. Nobody has to do anything.
#
# WHY A COMMIT RATHER THAN A BUILD STEP. Cloudflare could generate these during
# its own build, but that would put a database credential in the Pages
# environment and make every deploy depend on Supabase being reachable. Writing
# them into the repository instead means the pages are versioned, reviewable in
# a diff, and still there if the database is down -- a static site that cannot
# be rebuilt is a bad trade for a marketing site whose whole job is being up.
#
# ANON KEY ONLY. The generator reads through get_sector_pulse_recent(), the
# SECURITY DEFINER function any browser may call, so this workflow never needs
# the service-role key. If these secrets leaked they would grant exactly what a
# visitor already has.
#
# Required repository secrets:
#   SUPABASE_URL
#   SUPABASE_ANON_KEY

name: pulse-pages

on:
  schedule:
    # 23:40 UTC, forty minutes after the price sync writes the day's bar and
    # the pulse rows. Off the hour on purpose -- the top of the hour is when
    # every cron on GitHub fires at once and gets queued.
    - cron: "40 23 * * *"
  # A button, for when you want today's page without waiting for tonight.
  workflow_dispatch:

permissions:
  contents: write

# Never let a delayed run overlap a manual one: two jobs committing generated
# pages to the same branch is a merge conflict with no human to resolve it.
concurrency:
  group: pulse-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 scripts/generate_pulse_pages.py --days 90

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/pulse site/sitemap.xml
          # No new trading day means no diff, and an empty commit every night
          # would be noise in a history people actually read.
          if git diff --cached --quiet; then
            echo "no change -- no trading day since the last run"
            exit 0
          fi
          git commit -m "chore(site): sector activity pages through $(date -u +%Y-%m-%d)

          Generated by .github/workflows/pulse_pages.yml from public.sector_pulse
          via the anon reader. One page per trading day; sitemap regenerated."
          git push origin develop
